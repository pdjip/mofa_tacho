; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = platformio.local*.ini

[env:giga_r1_m7]
platform = ststm32
board = giga_r1_m7
framework = arduino
monitor_speed = 115200
build_flags =
    -D LV_CONF_SKIP
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_FONT_MONTSERRAT_20=1
    ; Trim LVGL to what the UI uses (arc, image, label, scale). Re-enable a flag
    ; here if a new widget or image format is added in EEZ Studio.
    ; ARGB8888 is also LVGL's layer format: with it off, styles that need a layer
    ; with alpha (opa_layered, transform/rotation, clip_corner, bitmap masks,
    ; blend modes) can render blank without any error. Re-enable it before
    ; using those in EEZ Studio.
    -D LV_USE_CHART=0
    -D LV_USE_CALENDAR=0
    -D LV_USE_KEYBOARD=0
    -D LV_USE_TABLE=0
    -D LV_USE_TABVIEW=0
    -D LV_USE_TILEVIEW=0
    -D LV_USE_MENU=0
    -D LV_USE_SPAN=0
    -D LV_USE_TEXTAREA=0
    -D LV_USE_ROLLER=0
    -D LV_USE_DROPDOWN=0
    -D LV_USE_LIST=0
    -D LV_USE_MSGBOX=0
    -D LV_USE_WIN=0
    -D LV_USE_SPINBOX=0
    -D LV_USE_SPINNER=0
    -D LV_USE_SLIDER=0
    -D LV_USE_SWITCH=0
    -D LV_USE_CHECKBOX=0
    -D LV_USE_BAR=0
    -D LV_USE_BUTTONMATRIX=0
    -D LV_USE_LED=0
    -D LV_USE_IMAGEBUTTON=0
    -D LV_USE_ANIMIMG=0
    -D LV_USE_CANVAS=0
    -D LV_USE_ARCLABEL=0
    -D LV_DRAW_SW_SUPPORT_ARGB8888=0
    -D LV_DRAW_SW_SUPPORT_XRGB8888=0
    -D LV_DRAW_SW_SUPPORT_RGB888=0
    -D LV_DRAW_SW_SUPPORT_L8=0
    -D LV_DRAW_SW_SUPPORT_AL88=0
    -D LV_DRAW_SW_SUPPORT_I1=0
    -D LV_DRAW_SW_SUPPORT_RGB565_SWAPPED=0
    -D LV_DRAW_SW_SUPPORT_ARGB8888_PREMULTIPLIED=0
    -D LV_USE_BUTTON=0
    -D LV_USE_FLEX=0
    -D LV_USE_GRID=0
    -D LV_USE_OBSERVER=0
lib_deps =
    arduino-libraries/Arduino_GigaDisplayTouch@^1.1.2
    lvgl/lvgl@^9.6.0
    arkhipenko/TaskScheduler@^4.1.1
  	facchinm/Arduino_USBHostMbed5@^0.3.1
	sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.29
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6
lib_archive = false